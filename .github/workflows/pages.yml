name: Publish Showcase

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble only the static presentation
        run: |
          mkdir -p _site/docs _site/assets
          cp -R docs/showcase _site/docs/showcase
          cp -R assets/readme _site/assets/readme
          cp -R preview _site/preview
          cp README.md README_EN.md _site/
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=docs/showcase/"><title>GridPulse</title><a href="docs/showcase/">Open GridPulse</a></html>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
