name: Research Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU training and application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Restore and verify bundled evidence
        run: python scripts/prepare_release.py
      - name: Run regression tests
        run: python -m pytest
      - name: Check dashboard workflows
        run: python scripts/check_app.py
      - name: Independently audit V8 trajectories
        run: python scripts/verify_envelope_results.py
